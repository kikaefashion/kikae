name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build production binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build on EAS
        run: npx eas-cli build --platform all --profile production --non-interactive --no-wait

  # --------------------------------------------------------------------------
  # Submit to the app stores (DISABLED until store credentials are configured).
  #
  # Before enabling, set up credentials and add them as GitHub secrets:
  #   - iOS:     App Store Connect API key (EAS_ASC_API_KEY_ID,
  #              EAS_ASC_API_KEY_ISSUER_ID, EAS_ASC_API_KEY_PATH)
  #              or Apple ID + app-specific password + team id.
  #   - Android: Google Play service account key (managed by EAS).
  #
  # To enable: remove the `if: false` line and uncomment this job.
  # --------------------------------------------------------------------------
  # submit:
  #   name: Submit to app stores
  #   runs-on: ubuntu-latest
  #   needs: build
  #   if: false
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v7
  #
  #     - name: Set up EAS
  #       uses: expo/expo-github-action@v9
  #       with:
  #         eas-version: latest
  #         token: ${{ secrets.EXPO_TOKEN }}
  #
  #     - name: Submit to app stores
  #       run: npx eas-cli submit --platform all --latest --non-interactive
