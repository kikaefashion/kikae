name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test with coverage
        run: yarn test

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  expo-health:
    name: Expo doctor & dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Expo Doctor
        run: yarn expo-doctor

      - name: Audit dependencies
        run: node scripts/check-audit.js

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Export web build
        shell: bash
        env:
          EXPO_PUBLIC_AUTH_URL: ${{ vars.EXPO_PUBLIC_AUTH_URL }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_MEDIA_URL_PREFIX: ${{ vars.EXPO_PUBLIC_MEDIA_URL_PREFIX }}
        run: |
          # Fall back to the dev URLs in .env.example when the GitHub Variables
          # are not configured, so the build smoke-test still passes. Set the
          # EXPO_PUBLIC_* Actions variables to override these for real builds.
          export EXPO_PUBLIC_AUTH_URL="${EXPO_PUBLIC_AUTH_URL:-https://dev.kikae.com.ng}"
          export EXPO_PUBLIC_API_URL="${EXPO_PUBLIC_API_URL:-https://dev.kikae.com.ng/api}"
          export EXPO_PUBLIC_MEDIA_URL_PREFIX="${EXPO_PUBLIC_MEDIA_URL_PREFIX:-https://file-dev.kikae.com.ng/}"
          npx expo export --platform web

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: dist/
          if-no-files-found: error
          retention-days: 14

  e2e-web:
    name: Web end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Export web build (dummy URLs)
        env:
          # Hermetic URLs, inlined at build time — never the GitHub Variables.
          EXPO_PUBLIC_AUTH_URL: https://auth.e2e.test
          EXPO_PUBLIC_API_URL: https://api.e2e.test
          EXPO_PUBLIC_MEDIA_URL_PREFIX: https://media.e2e.test/
        run: npx expo export --platform web

      - name: Run Playwright
        run: npx playwright test

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
