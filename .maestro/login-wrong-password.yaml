# Local end-to-end login flow (Maestro) for the wrong-password error state.
# MAESTRO_EMAIL comes from the shell; MAESTRO_WRONG_PASSWORD is any value that
# is not the real password (never commit real credentials).
appId: com.kikae.kikaeFrontend.dev
---
- launchApp
- assertVisible: 'Welcome back'
- tapOn: 'Email'
- inputText: ${MAESTRO_EMAIL}
- tapOn: 'Password'
- inputText: ${MAESTRO_WRONG_PASSWORD}
- tapOn: 'Login'
- assertVisible: 'Incorrect email or password'
